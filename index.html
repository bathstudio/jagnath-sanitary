<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JAGNATH BATHWARE</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#171717}.top{background:#111827;color:#fff;text-align:center;padding:8px;font-size:13px}
header{position:sticky;top:0;background:#fff;border-bottom:1px solid #eee;z-index:5}.nav{max-width:1250px;margin:auto;padding:15px 20px;display:flex;gap:15px;align-items:center}.logo{font-size:23px;font-weight:800;white-space:nowrap}.logo span{font-weight:400;color:#777}.search{display:flex;flex:1;border:1px solid #ddd;border-radius:8px;overflow:hidden}.search input{flex:1;border:0;padding:12px;outline:0}.search button,.cart,.add,.checkout{border:0;background:#111827;color:#fff;padding:12px 16px;cursor:pointer}.cart,.add,.checkout{border-radius:7px}
.hero,.wrap{max-width:1250px;margin:22px auto;padding:0 20px}.heroBox{padding:45px 7%;border-radius:18px;background:#eef1f4}h1{font-size:42px;margin:0 0 10px}.bar{display:flex;justify-content:space-between;gap:10px;align-items:center}.filters{display:flex;gap:8px}.filters select{padding:10px;border:1px solid #ddd;border-radius:7px}.products{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.card{border:1px solid #eee;border-radius:12px;overflow:hidden;position:relative}.pic{height:230px;background:#f7f7f7}.pic img{width:100%;height:100%;object-fit:contain}.info{padding:14px}.brand,.code{font-size:12px;color:#777}.name{font-weight:600;min-height:42px;margin:6px 0}.old{text-decoration:line-through;color:#999;margin-right:5px}.new{font-size:18px;font-weight:700}.add{width:100%;margin-top:10px}.badge{position:absolute;top:9px;left:9px;background:#111827;color:#fff;padding:5px 7px;font-size:11px;border-radius:5px}
.overlay{display:none;position:fixed;inset:0;background:#0008;z-index:10}.overlay.open{display:block}.drawer{margin-left:auto;width:min(440px,100%);height:100%;background:#fff;padding:20px;overflow:auto}.item{display:flex;gap:10px;padding:13px 0;border-bottom:1px solid #eee}.thumb{width:65px;height:65px;background:#f5f5f5}.thumb img{width:100%;height:100%;object-fit:contain}.total{display:flex;justify-content:space-between;font-size:20px;font-weight:700;margin:20px 0}
@media(max-width:900px){.products{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.nav{flex-wrap:wrap}.search{flex-basis:100%}.products{grid-template-columns:repeat(2,1fr);gap:10px}h1{font-size:32px}}
</style></head><body>
<div class="top">JAGNATH BATHWARE • SANITARYWARE & CP FITTINGS</div><header><div class="nav"><div class="logo">JAGNATH <span>BATHWARE</span></div><div class="search"><input id="q" placeholder="Search product, brand or Article No."><button onclick="filterP()">Search</button></div><button class="cart" onclick="openCart()">🛒 Cart (<span id="count">0</span>)</button></div></header>
<section class="hero"><div class="heroBox"><h1>Premium Bathroom Collection</h1><p>Shop sanitaryware and CP fittings from JAGNATH BATHWARE.</p></div></section>
<section class="wrap"><div class="bar"><h2>Products</h2><div class="filters"><select id="brand" onchange="filterP()"><option value="">All Brands</option></select><select id="cat" onchange="filterP()"><option value="">All Categories</option></select></div></div><div class="products" id="grid"></div></section>
<div class="overlay" id="overlay" onclick="if(event.target===this)closeCart()"><div class="drawer"><div style="display:flex;justify-content:space-between"><h2>Your Cart</h2><button onclick="closeCart()">✕</button></div><div id="items"></div><div class="total"><span>Total</span><span id="total">₹0</span></div><button class="checkout" style="width:100%" onclick="checkout()">Proceed to Checkout</button></div></div>
<script>
let P=[],cart=JSON.parse(localStorage.getItem('jcart')||'[]');const money=x=>'₹'+Number(x||0).toLocaleString('en-IN');
fetch('products.json').then(r=>r.json()).then(x=>{P=x;setup();render(P);update()});
function setup(){let b=[...new Set(P.map(x=>x.brand).filter(Boolean))].sort(),c=[...new Set(P.map(x=>x.category).filter(Boolean))].sort();brand.innerHTML+=[...b].map(x=>'<option>'+x+'</option>').join('');cat.innerHTML+=[...c].map(x=>'<option>'+x+'</option>').join('')}
function filterP(){let q=document.getElementById('q').value.toLowerCase(),b=brand.value,c=cat.value;render(P.filter(p=>(!q||(p.name+' '+p.brand+' '+p.article+' '+p.category).toLowerCase().includes(q))&&(!b||p.brand===b)&&(!c||p.category===c)))}
function render(a){grid.innerHTML=a.length?a.map(p=>{let im=p.images&&p.images[0],off=p.offer&&p.mrp&&Number(p.offer)<Number(p.mrp);return '<div class="card">'+(off?'<div class="badge">'+Math.round((1-p.offer/p.mrp)*100)+'% OFF</div>':'')+'<div class="pic">'+(im?'<img src="'+im+'">':'No Image')+'</div><div class="info"><div class="brand">'+p.brand+'</div><div class="name">'+p.name+'</div><div class="code">Article No: '+p.article+'</div><div>'+(off?'<span class="old">'+money(p.mrp)+'</span>':'')+'<span class="new">'+money(p.offer||p.mrp)+'</span></div><button class="add" onclick="add('+p.id+')">ADD TO CART</button></div></div>'}).join(''):'<p>No products found.</p>'}
function add(id){let x=cart.find(x=>x.id===id);x?x.qty++:cart.push({id,qty:1});save();openCart()}function save(){localStorage.setItem('jcart',JSON.stringify(cart));update()}function update(){count.textContent=cart.reduce((s,x)=>s+x.qty,0);items.innerHTML=cart.length?cart.map(x=>{let p=P.find(y=>y.id===x.id);return '<div class="item"><div class="thumb">'+(p.images?.[0]?'<img src="'+p.images[0]+'">':'')+'</div><div><b>'+p.name+'</b><div class="code">'+p.article+'</div><button onclick="chg('+p.id+',-1)">−</button> '+x.qty+' <button onclick="chg('+p.id+',1)">+</button></div></div>'}).join(''):'<p>Your cart is empty.</p>';total.textContent=money(cart.reduce((s,x)=>{let p=P.find(y=>y.id===x.id);return s+(p.offer||p.mrp)*x.qty},0))}function chg(id,d){let x=cart.find(x=>x.id===id);x.qty+=d;if(x.qty<1)cart=cart.filter(x=>x.id!==id);save()}function openCart(){overlay.classList.add('open');update()}function closeCart(){overlay.classList.remove('open')}function checkout(){alert('Next step: customer details + WhatsApp/order confirmation.')}
</script></body></html>
