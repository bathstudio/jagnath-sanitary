<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JAGNATH BATHWARE</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;color:#171717;background:#fff}
.top{background:#111827;color:#fff;text-align:center;padding:8px;font-size:13px}
header{position:sticky;top:0;background:#fff;border-bottom:1px solid #eee;z-index:5}
.nav{max-width:1250px;margin:auto;padding:15px 20px;display:flex;gap:15px;align-items:center}
.logo{font-size:23px;font-weight:800;white-space:nowrap}.logo span{font-weight:400;color:#777}
.search{display:flex;flex:1;border:1px solid #ddd;border-radius:8px;overflow:hidden}
.search input{flex:1;border:0;padding:12px;outline:0;font-size:15px}
.search button,.cart,.add,.checkout{border:0;background:#111827;color:#fff;padding:12px 16px;cursor:pointer}
.cart,.add,.checkout{border-radius:7px}
.hero,.wrap{max-width:1250px;margin:22px auto;padding:0 20px}
.heroBox{padding:45px 7%;border-radius:18px;background:#eef1f4}
h1{font-size:42px;margin:0 0 10px}
.bar{display:flex;justify-content:space-between;gap:10px;align-items:center}
.filters{display:flex;gap:8px}.filters select{padding:10px;border:1px solid #ddd;border-radius:7px}
.products{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.card{border:1px solid #eee;border-radius:12px;overflow:hidden;position:relative;background:#fff}
.pic{height:230px;background:#f7f7f7}
.pic button{width:100%;height:100%;border:0;background:transparent;padding:0;cursor:zoom-in}
.pic img{width:100%;height:100%;object-fit:contain}
.info{padding:14px}.brand,.code{font-size:12px;color:#777}
.name{font-weight:600;min-height:42px;margin:6px 0}
.old{text-decoration:line-through;color:#999;margin-right:5px}
.new{font-size:18px;font-weight:700}
.price-line{margin-top:7px}.price-label{font-size:12px;color:#777}
.add{width:100%;margin-top:10px}.badge{position:absolute;top:9px;left:9px;background:#111827;color:#fff;padding:5px 7px;font-size:11px;border-radius:5px}
.status{padding:15px 0;color:#666}.status.error{color:#b91c1c}
.overlay{display:none;position:fixed;inset:0;background:#0008;z-index:10}
.overlay.open{display:block}.drawer{margin-left:auto;width:min(440px,100%);height:100%;background:#fff;padding:20px;overflow:auto}
.item{display:flex;gap:10px;padding:13px 0;border-bottom:1px solid #eee}
.thumb{width:65px;height:65px;background:#f5f5f5}.thumb img{width:100%;height:100%;object-fit:contain}
.total{display:flex;justify-content:space-between;font-size:20px;font-weight:700;margin:20px 0}
.image-modal{display:none;position:fixed;inset:0;background:#000c;z-index:20;align-items:center;justify-content:center;padding:20px}
.image-modal.open{display:flex}.image-box{position:relative;background:#fff;border-radius:10px;padding:10px;max-width:95vw;max-height:95vh}
.image-box img{display:block;max-width:90vw;max-height:88vh;object-fit:contain}
.close-image{position:absolute;right:8px;top:8px;border:0;background:#111827;color:#fff;border-radius:50%;width:34px;height:34px;cursor:pointer}
@media(max-width:900px){.products{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.nav{flex-wrap:wrap}.search{flex-basis:100%}.products{grid-template-columns:repeat(2,1fr);gap:10px}h1{font-size:32px}}
</style>
</head>
<body>

<div class="top">JAGNATH BATHWARE • SANITARYWARE & CP FITTINGS</div>

<header>
<div class="nav">
<div class="logo">JAGNATH <span>BATHWARE</span></div>
<div class="search">
<input id="q" placeholder="Search product, brand or Article No.">
<button id="searchBtn">Search</button>
</div>
<button class="cart" id="cartBtn">🛒 Cart (<span id="count">0</span>)</button>
</div>
</header>

<section class="hero">
<div class="heroBox">
<h1>Premium Bathroom Collection</h1>
<p>Shop sanitaryware and CP fittings from JAGNATH BATHWARE.</p>
</div>
</section>

<section class="wrap">
<div class="bar">
<h2 id="sectionTitle">Featured Products</h2>
<div class="filters">
<select id="brand"><option value="">All Brands</option></select>
<select id="cat"><option value="">All Categories</option></select>
</div>
</div>
<div id="status" class="status">Loading products...</div>
<div class="products" id="grid"></div>
</section>

<div class="image-modal" id="imageModal" onclick="if(event.target===this)closeImage()">
<div class="image-box">
<button class="close-image" onclick="closeImage()">✕</button>
<img id="largeImage" src="" alt="Product image">
</div>
</div>

<div class="overlay" id="overlay" onclick="if(event.target===this)closeCart()">
<div class="drawer">
<div style="display:flex;justify-content:space-between"><h2>Your Cart</h2><button id="closeCartBtn">✕</button></div>
<div id="items"></div>
<div class="total"><span>Total</span><span id="total">₹0</span></div>
<button class="checkout" style="width:100%" id="checkoutBtn">Proceed to Checkout</button>
</div>
</div>

<script>
const DATA_URL = 'https://bathstudio.github.io/jagnath-sanitary/products_ROOT_IMAGES_READY.json';

let P=[];
let cart=JSON.parse(localStorage.getItem('jcart')||'[]');

const $=id=>document.getElementById(id);
const money=x=>'₹'+Number(x||0).toLocaleString('en-IN',{maximumFractionDigits:0});

function escapeHtml(v){
return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function offerRate(p){
let mrp=Number(p.mrp??p.MRP??0)||0;
let raw=p.offer??p.offer_rate??p.OFFER_RATE;

if(raw===undefined||raw===null||raw==='') return mrp;
if(typeof raw==='number') return raw;

let s=String(raw).trim().replace(/\s/g,'');
let m=s.match(/(?:=?[A-Z]+\d+|=?MRP)\*(\d+(?:\.\d+)?)%$/i);
if(m) return mrp*Number(m[1])/100;

let pct=s.match(/^=?(\d+(?:\.\d+)?)%$/);
if(pct) return mrp*Number(pct[1])/100;

let n=Number(s.replace(/[₹,]/g,''));
return Number.isFinite(n)?n:mrp;
}

function normalize(p,index){
return {
id:p.id??p.ID??p.article??p.article_no??index,
name:p.name??p.product_name??p.PRODUCT_NAME??'Product',
brand:p.brand??p.BRAND??'',
category:p.category??p.CATEGORY??'',
article:p.article??p.article_no??p.ARTICLE_NO??p.articleNo??'',
mrp:Number(p.mrp??p.MRP??0)||0,
offer:offerRate(p),
images:Array.isArray(p.images)?p.images:(p.image?[p.image]:(p.IMAGE?[p.IMAGE]:[])),
raw:p
};
}

function setupFilters(){
const brands=[...new Set(P.map(p=>p.brand).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
const cats=[...new Set(P.map(p=>p.category).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
$('brand').innerHTML='<option value="">All Brands</option>'+brands.map(x=>`<option value="${escapeHtml(x)}">${escapeHtml(x)}</option>`).join('');
$('cat').innerHTML='<option value="">All Categories</option>'+cats.map(x=>`<option value="${escapeHtml(x)}">${escapeHtml(x)}</option>`).join('');
}

function render(list,title){
$('sectionTitle').textContent=title;
$('status').textContent=list.length?'': 'No products found.';
$('grid').innerHTML=list.map((p,i)=>{
let off=p.offer<p.mrp&&p.mrp>0;
let discount=off?Math.round((1-p.offer/p.mrp)*100):0;
let im=p.images[0]||'';

return `<div class="card">
${off?`<div class="badge">${discount}% OFF</div>`:''}
<div class="pic">${im
?`<button type="button" onclick='openImage(${JSON.stringify(im)})'><img src="${escapeHtml(im)}" alt="${escapeHtml(p.name)}" onerror="this.parentElement.style.display='none'"></button>`
:'<div style="padding:80px 10px;text-align:center;color:#999">No Image</div>'}</div>
<div class="info">
<div class="brand">${escapeHtml(p.brand)}</div>
<div class="name">${escapeHtml(p.name)}</div>
<div class="code">Article No: ${escapeHtml(p.article)}</div>
<div class="price-line"><span class="price-label">MRP:</span> <span class="${off?'old':''}">${money(p.mrp)}</span></div>
<div class="price-line"><span class="price-label">Offer Rate:</span> <span class="new">${money(p.offer)}</span></div>
<button class="add" onclick='addToCart(${JSON.stringify(p.id)})'>ADD TO CART</button>
</div></div>`;
}).join('');
}

function featured(){
/* Only first 8 products are shown on the home page. */
render(P.slice(0,8),'Featured Products');
}

function doSearch(){
const q=$('q').value.trim().toLowerCase();
const b=$('brand').value;
const c=$('cat').value;

if(!q&&!b&&!c){
featured();
return;
}

const result=P.filter(p=>{
const hay=[p.name,p.brand,p.article,p.category].join(' ').toLowerCase();
return (!q||hay.includes(q))&&(!b||p.brand===b)&&(!c||p.category===c);
});
render(result,`Search Results (${result.length})`);
}

function openImage(src){
$('largeImage').src=src;
$('imageModal').classList.add('open');
}
function closeImage(){
$('imageModal').classList.remove('open');
$('largeImage').src='';
}

function addToCart(id){
let x=cart.find(x=>String(x.id)===String(id));
if(x)x.qty++;
else cart.push({id:id,qty:1});
saveCart();
openCart();
}

function saveCart(){
localStorage.setItem('jcart',JSON.stringify(cart));
updateCart();
}

function updateCart(){
$('count').textContent=cart.reduce((s,x)=>s+x.qty,0);

$('items').innerHTML=cart.length?cart.map(x=>{
let p=P.find(y=>String(y.id)===String(x.id));
if(!p)return '';
return `<div class="item">
<div class="thumb">${p.images[0]?`<img src="${escapeHtml(p.images[0])}">`:''}</div>
<div><b>${escapeHtml(p.name)}</b><div class="code">${escapeHtml(p.article)}</div>
<button onclick='changeQty(${JSON.stringify(x.id)},-1)'>−</button>
${x.qty}
<button onclick='changeQty(${JSON.stringify(x.id)},1)'>+</button></div>
</div>`;
}).join(''):'<p>Your cart is empty.</p>';

$('total').textContent=money(cart.reduce((s,x)=>{
let p=P.find(y=>String(y.id)===String(x.id));
return s+(p?p.offer:0)*x.qty;
},0));
}

function changeQty(id,d){
let x=cart.find(x=>String(x.id)===String(id));
if(!x)return;
x.qty+=d;
if(x.qty<1)cart=cart.filter(x=>String(x.id)!==String(id));
saveCart();
}

function openCart(){$('overlay').classList.add('open');updateCart()}
function closeCart(){$('overlay').classList.remove('open')}

function checkout(){
alert('Next step: customer details + WhatsApp/order confirmation.');
}

async function loadProducts(){
try{
const r=await fetch(DATA_URL,{cache:'no-store'});
if(!r.ok)throw new Error('HTTP '+r.status);
const data=await r.json();
if(!Array.isArray(data))throw new Error('JSON is not an array');

P=data.map(normalize);
$('status').textContent='';
setupFilters();
featured();
updateCart();
}catch(err){
console.error(err);
$('status').className='status error';
$('status').textContent='Product data load nahi ho raha. Please check products_ROOT_IMAGES_READY.json';
}
}

$('searchBtn').addEventListener('click',doSearch);
$('q').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch()});
$('brand').addEventListener('change',doSearch);
$('cat').addEventListener('change',doSearch);
$('cartBtn').addEventListener('click',openCart);
$('closeCartBtn').addEventListener('click',closeCart);
$('checkoutBtn').addEventListener('click',checkout);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeImage();closeCart()}});

loadProducts();
</script>
</body>
</html>
