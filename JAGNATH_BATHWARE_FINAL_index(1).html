<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>JAGNATH BATHWARE</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
color:#171717;
background:#fff
}

.top{
background:#111827;
color:#fff;
text-align:center;
padding:8px;
font-size:13px
}

header{
position:sticky;
top:0;
background:#fff;
border-bottom:1px solid #eee;
z-index:5
}

.nav{
max-width:1250px;
margin:auto;
padding:15px 20px;
display:flex;
gap:15px;
align-items:center
}

.logo{
font-size:23px;
font-weight:800;
white-space:nowrap
}

.logo span{
font-weight:400;
color:#777
}

.search{
display:flex;
flex:1;
border:1px solid #ddd;
border-radius:8px;
overflow:hidden
}

.search input{
flex:1;
border:0;
padding:12px;
outline:0
}

.search button,
.cart,
.add,
.checkout{
border:0;
background:#111827;
color:#fff;
padding:12px 16px;
cursor:pointer
}

.cart,
.add,
.checkout{
border-radius:7px
}

.hero,
.wrap{
max-width:1250px;
margin:22px auto;
padding:0 20px
}

.heroBox{
padding:45px 7%;
border-radius:18px;
background:#eef1f4
}

h1{
font-size:42px;
margin:0 0 10px
}

.bar{
display:flex;
justify-content:space-between;
gap:10px;
align-items:center
}

.filters{
display:flex;
gap:8px
}

.filters select{
padding:10px;
border:1px solid #ddd;
border-radius:7px
}

.products{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:18px
}

.card{
border:1px solid #eee;
border-radius:12px;
overflow:hidden;
position:relative;
background:#fff
}

.pic{
height:230px;
background:#f7f7f7
}

.pic img{
width:100%;
height:100%;
object-fit:contain
}

.info{
padding:14px
}

.brand,
.code{
font-size:12px;
color:#777
}

.name{
font-weight:600;
min-height:42px;
margin:6px 0
}

.old{
text-decoration:line-through;
color:#999;
margin-right:5px
}

.new{
font-size:18px;
font-weight:700
}

.add{
width:100%;
margin-top:10px
}

.badge{
position:absolute;
top:9px;
left:9px;
background:#111827;
color:#fff;
padding:5px 7px;
font-size:11px;
border-radius:5px
}

.overlay{
display:none;
position:fixed;
inset:0;
background:#0008;
z-index:10
}

.overlay.open{
display:block
}

.drawer{
margin-left:auto;
width:min(440px,100%);
height:100%;
background:#fff;
padding:20px;
overflow:auto
}

.item{
display:flex;
gap:10px;
padding:13px 0;
border-bottom:1px solid #eee
}

.thumb{
width:65px;
height:65px;
background:#f5f5f5
}

.thumb img{
width:100%;
height:100%;
object-fit:contain
}

.total{
display:flex;
justify-content:space-between;
font-size:20px;
font-weight:700;
margin:20px 0
}


.image-click{width:100%;height:100%;border:0;background:transparent;padding:0;cursor:zoom-in;display:block}
.image-click img{cursor:zoom-in}
.image-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:30;align-items:center;justify-content:center;padding:30px}
.image-modal.open{display:flex}
.image-modal img{max-width:95vw;max-height:90vh;object-fit:contain;background:#fff;border-radius:8px}
.image-modal .close-image{position:absolute;top:18px;right:24px;border:0;background:#fff;color:#111;width:42px;height:42px;border-radius:50%;font-size:24px;cursor:pointer}
.price-row{margin-top:8px}
.mrp-label,.offer-label{font-size:12px;color:#777;margin-right:5px}

@media(max-width:900px){
.products{
grid-template-columns:repeat(2,1fr)
}
}

@media(max-width:560px){
.nav{
flex-wrap:wrap
}

.search{
flex-basis:100%
}

.products{
grid-template-columns:repeat(2,1fr);
gap:10px
}

h1{
font-size:32px
}
}
</style>
</head>

<body>

<div class="top">
JAGNATH BATHWARE • SANITARYWARE & CP FITTINGS
</div>

<header>
<div class="nav">

<div class="logo">
JAGNATH <span>BATHWARE</span>
</div>

<div class="search">
<input
id="q"
placeholder="Search product, brand or Article No."
onkeyup="filterP()"
>
<button onclick="filterP()">Search</button>
</div>

<button class="cart" onclick="openCart()">
🛒 Cart (<span id="count">0</span>)
</button>

</div>
</header>

<section class="hero">

<div class="heroBox">

<h1>Premium Bathroom Collection</h1>

<p>
Shop sanitaryware and CP fittings from JAGNATH BATHWARE.
</p>

</div>

</section>

<section class="wrap">

<div class="bar">

<h2>Products</h2>

<div class="filters">

<select id="brand" onchange="filterP()">
<option value="">All Brands</option>
</select>

<select id="cat" onchange="filterP()">
<option value="">All Categories</option>
</select>

</div>

</div>

<div class="products" id="grid"></div>

</section>

<div
class="overlay"
id="overlay"
onclick="if(event.target===this)closeCart()"
>

<div class="drawer">

<div style="display:flex;justify-content:space-between">

<h2>Your Cart</h2>

<button onclick="closeCart()">✕</button>

</div>

<div id="items"></div>

<div class="total">

<span>Total</span>

<span id="total">₹0</span>

</div>

<button
class="checkout"
style="width:100%"
onclick="checkout()"
>
Proceed to Checkout
</button>

</div>

</div>

<script>

let P=[];

let cart=JSON.parse(
localStorage.getItem('jcart') || '[]'
);

const money=x =>
'₹'+Number(x||0).toLocaleString('en-IN');


/* LOAD PRODUCT DATA */

fetch('https://raw.githubusercontent.com/bathstudio/jagnath-sanitary/main/products.json')
.then(r=>{

if(!r.ok){
throw new Error('JSON file not found');
}

return r.json();

})
.then(data=>{

/*
Support different JSON formats
*/

if(Array.isArray(data)){
P=data;
}
else if(Array.isArray(data.products)){
P=data.products;
}
else{
P=[];
}

console.log('Products Loaded:',P.length);

setup();

render(P);

update();

})
.catch(error=>{

console.error(error);

grid.innerHTML=`
<div style="
grid-column:1/-1;
padding:30px;
text-align:center;
color:red;
">
Product data load nahi ho raha.<br>
Please check products_ROOT_IMAGES_READY.json
</div>
`;

});


/* SETUP FILTERS */

function setup(){

let brands=[
...new Set(
P.map(x=>x.brand || x.BRAND || '')
.filter(Boolean)
)
].sort();

let categories=[
...new Set(
P.map(x=>x.category || x.CATEGORY || '')
.filter(Boolean)
)
].sort();

brand.innerHTML=
'<option value="">All Brands</option>'+
brands
.map(x=>`<option value="${escapeHtml(x)}">${escapeHtml(x)}</option>`)
.join('');

cat.innerHTML=
'<option value="">All Categories</option>'+
categories
.map(x=>`<option value="${escapeHtml(x)}">${escapeHtml(x)}</option>`)
.join('');

}


/* SEARCH + FILTER */

function filterP(){

let q=document
.getElementById('q')
.value
.toLowerCase()
.trim();

let b=brand.value;
let c=cat.value;

let result=P.filter(p=>{

let name=p.name || p.product_name || p.PRODUCT_NAME || '';

let article=
p.article ||
p.article_no ||
p.ARTICLE_NO ||
p.articleNo ||
'';

let br=
p.brand ||
p.BRAND ||
'';

let category=
p.category ||
p.CATEGORY ||
'';

let text=
(name+' '+br+' '+article+' '+category)
.toLowerCase();

return
(!q || text.includes(q)) &&
(!b || br===b) &&
(!c || category===c);

});

render(result);

}


/* PRODUCT DISPLAY */

function render(arr){

if(!arr.length){
grid.innerHTML='<p>No products found.</p>';
return;
}

grid.innerHTML=arr.map((p,index)=>{

let name=p.name||p.product_name||p.PRODUCT_NAME||'Product';
let brandName=p.brand||p.BRAND||'';
let article=p.article||p.article_no||p.ARTICLE_NO||p.articleNo||'';
let mrp=Number(p.mrp??p.MRP??0)||0;
let offer=calculateOffer(p.offer??p.offer_rate??p.OFFER_RATE,mrp);

let image='';
if(Array.isArray(p.images)&&p.images.length) image=p.images[0];
else if(p.image) image=p.image;
else if(p.IMAGE) image=p.IMAGE;
else image=findImage(article,index);

let off=offer>0&&mrp>0&&offer<mrp;
let discount=off?Math.round((1-off/mrp)*100):0;
let productId=p.id??p.ID??article??index;

return `
<div class="card">
${off?`<div class="badge">${discount}% OFF</div>`:''}
<div class="pic">
${image
?`<button class="image-click" type="button" onclick='openImage(${JSON.stringify(String(image))},${JSON.stringify(String(name))})'>
<img src="${image}" alt="${escapeHtml(name)}" onerror="this.style.display='none'">
</button>`
:'<div style="padding:80px 10px;text-align:center;color:#999">No Image</div>'}
</div>
<div class="info">
<div class="brand">${escapeHtml(brandName)}</div>
<div class="name">${escapeHtml(name)}</div>
<div class="code">Article No: ${escapeHtml(article)}</div>
<div class="price-row"><span class="mrp-label">MRP:</span><span class="old">${money(mrp)}</span></div>
<div class="price-row"><span class="offer-label">Offer Rate:</span><span class="new">${money(offer||mrp)}</span></div>
${off?`<div class="code">${discount}% OFF</div>`:''}
<button class="add" onclick='add(${JSON.stringify(String(productId))})'>ADD TO CART</button>
</div>
</div>`;
}).join('');
}


/* OFFER RATE: supports 55%, E2*55%, MRP*55%, or numeric values */
function calculateOffer(value,mrp){
if(value===null||value===undefined||value==='') return mrp;
if(typeof value==='number') return value;
let s=String(value).trim().toUpperCase().replace(/\s+/g,'');
let m=s.match(/(?:[A-Z]+\d+|MRP)?\*(\d+(?:\.\d+)?)%$/);
if(m) return mrp*(Number(m[1])/100);
let pct=s.match(/^(\d+(?:\.\d+)?)%$/);
if(pct) return mrp*(Number(pct[1])/100);
let n=Number(s.replace(/,/g,''));
return Number.isFinite(n)?n:mrp;
}

function openImage(src,name){
let modal=document.getElementById('imageModal');
document.getElementById('largeImage').src=src;
document.getElementById('largeImage').alt=name||'Product image';
modal.classList.add('open');
}
function closeImage(){
document.getElementById('imageModal').classList.remove('open');
document.getElementById('largeImage').src='';
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeImage();});

/* IMAGE FALLBACK */

function findImage(article,index){

if(!article){
return '';
}

/*
Your GitHub image names are like:

3_26231000.png
4_26228000.png
5_24150000.png

So first try article based image.
*/

return article
? `./${index+1}_${article}.png`
: '';

}


/* ADD TO CART */

function add(id){

let x=cart.find(
x=>String(x.id)===String(id)
);

if(x){

x.qty++;

}
else{

cart.push({
id:String(id),
qty:1
});

}

save();

openCart();

}


/* SAVE */

function save(){

localStorage.setItem(
'jcart',
JSON.stringify(cart)
);

update();

}


/* CART UPDATE */

function update(){

count.textContent=
cart.reduce(
(s,x)=>s+x.qty,
0
);

items.innerHTML=
cart.length
?
cart.map(x=>{

let p=P.find(y=>
String(
y.id ||
y.ID ||
y.article ||
y.article_no ||
y.ARTICLE_NO
)
===
String(x.id)
);

if(!p){
return '';
}

let name=
p.name ||
p.product_name ||
p.PRODUCT_NAME ||
'Product';

let article=
p.article ||
p.article_no ||
p.ARTICLE_NO ||
'';

let image=
Array.isArray(p.images)
?
p.images[0]
:
(p.image || '');

return `

<div class="item">

<div class="thumb">

${
image
?
`<img src="${image}">`
:
''
}

</div>

<div>

<b>${escapeHtml(name)}</b>

<div class="code">
${escapeHtml(article)}
</div>

<button onclick='chg(${JSON.stringify(String(x.id))},-1)'>
−
</button>

${x.qty}

<button onclick='chg(${JSON.stringify(String(x.id))},1)'>
+
</button>

</div>

</div>

`;

}).join('')
:
'<p>Your cart is empty.</p>';


let cartTotal=cart.reduce((sum,x)=>{

let p=P.find(y=>
String(
y.id ||
y.ID ||
y.article ||
y.article_no ||
y.ARTICLE_NO
)
===
String(x.id)
);

if(!p){
return sum;
}

let mrp=Number(p.mrp??p.MRP??0)||0;
let offer=calculateOffer(p.offer??p.offer_rate??p.OFFER_RATE,mrp);
return sum+offer*x.qty;

},0);

total.textContent=money(cartTotal);

}


/* CHANGE QTY */

function chg(id,d){

let x=cart.find(
x=>String(x.id)===String(id)
);

if(!x){
return;
}

x.qty+=d;

if(x.qty<1){

cart=cart.filter(
x=>String(x.id)!==String(id)
);

}

save();

}


/* CART OPEN */

function openCart(){

overlay.classList.add('open');

update();

}


/* CART CLOSE */

function closeCart(){

overlay.classList.remove('open');

}


/* CHECKOUT */

function checkout(){

alert(
'Next step: Customer Details + WhatsApp Order Confirmation'
);

}


/* HTML SECURITY */

function escapeHtml(value){

return String(value ?? '')
.replace(/&/g,'&amp;')
.replace(/</g,'&lt;')
.replace(/>/g,'&gt;')
.replace(/"/g,'&quot;')
.replace(/'/g,'&#039;');

}

</script>


<script>
function openImage(src){
  const m=document.getElementById('imageModal');
  const i=document.getElementById('previewImg');
  if(!m||!i)return;
  i.src=src;
  m.style.display='flex';
}
function closeImage(e){
  if(e && e.target && e.target.id!=='imageModal') return;
  const m=document.getElementById('imageModal');
  if(m)m.style.display='none';
}
</script>

</body>
</html>
